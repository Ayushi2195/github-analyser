<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>RepoFlow Report</title>
    <style>
        @page {
            size: A4;
            margin: 20mm 14mm 16mm 14mm;
        }
        body {
            font-family: Helvetica, Arial, sans-serif;
            font-size: 11px;
            color: #1f2937;
        }
        h1, h2, h3 {
            color: #111827;
            page-break-after: avoid;
        }
        h1 {
            font-size: 21px;
            margin: 0 0 6px 0;
        }
        h2 {
            font-size: 15px;
            margin-top: 18px;
            margin-bottom: 7px;
            border-bottom: 1px solid #dbe3f0;
            padding-bottom: 4px;
        }
        h3 {
            font-size: 12px;
            margin-top: 11px;
            margin-bottom: 4px;
        }
        p {
            line-height: 1.5;
            margin-bottom: 6px;
            color: #374151;
        }
        ul, ol {
            margin: 4px 0 8px 20px;
        }
        li {
            margin-bottom: 4px;
            color: #374151;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 10px 0;
            font-size: 11px;
        }
        th, td {
            border: 1px solid #d1d5db;
            padding: 6px 8px;
            vertical-align: top;
        }
        th {
            background: #eef2ff;
            color: #3730a3;
        }
        code {
            font-family: Courier, monospace;
            background: #f3f4f6;
            padding: 1px 3px;
        }
        .cover {
            border: 1px solid #d8ddf0;
            background: #f8f9ff;
            padding: 14px;
            margin-bottom: 14px;
        }
        .brand {
            font-size: 10px;
            letter-spacing: 1px;
            color: #4f46e5;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .subtitle {
            color: #6b7280;
            font-size: 10px;
            margin-top: 2px;
        }
        .meta-table td {
            border: 1px solid #e2e8f0;
            padding: 7px 8px;
            font-size: 10px;
        }
        .meta-key {
            width: 24%;
            background: #f8fafc;
            color: #475569;
            font-weight: bold;
        }
        .report-content hr {
            border: 0;
            border-top: 1px solid #e5e7eb;
            margin: 12px 0;
        }
    </style>
</head>
<body>
    <div class="cover">
        <div class="brand">REPOFLOW ANALYTICS</div>
        <h1>GitHub Repository Analysis Report</h1>
        <div class="subtitle">Structured report generated by RepoFlow</div>
    </div>

    <table class="meta-table">
        <tr>
            <td class="meta-key">Repository URL</td>
            <td>{{ repo_url }}</td>
        </tr>
        <tr>
            <td class="meta-key">Generated At</td>
            <td>{{ generated_at }}</td>
        </tr>
    </table>

    <div class="report-content">
        {{ report_html|safe }}
    </div>
</body>
</html>
