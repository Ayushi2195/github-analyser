<!DOCTYPE html>
<html>
<head>
    <title>GitHub Repo Analyzer</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        input[type="text"] { width: 70%; padding: 10px; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; background: #2ea44f; color: white; border: none; cursor: pointer; }
        .report { margin-top: 30px; border: 1px solid #ddd; padding: 20px; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>🔍 GitHub Repository Analyzer</h1>
    <form method="POST" action="/analyze/">
        {% csrf_token %}
        <input type="text" name="repo_url" placeholder="https://github.com/owner/repo" required>
        <button type="submit">Analyze</button>
    </form>
    {% if report %}
        <div class="report">{{ report|safe }}</div>
    {% endif %}
</body>
</html>
